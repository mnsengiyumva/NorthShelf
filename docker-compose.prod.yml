# Production stack: Caddy (HTTPS + website) -> backend (API) -> db.
# Only Caddy is reachable from the internet (ports 80/443). The database and API stay private.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_ENV: production
      PUBLIC_URL: ${PUBLIC_URL}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_PENDING_PER_USER: ${MAX_PENDING_PER_USER:-10}
      MAX_UPLOADS_PER_DAY: ${MAX_UPLOADS_PER_DAY:-15}
      MAX_USER_STORAGE_MB: ${MAX_USER_STORAGE_MB:-500}
    # No published ports: only Caddy (same network) can reach the API.
    # --proxy-headers makes rate limiting see each visitor's real IP.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_DONATE_URL: ${VITE_DONATE_URL:-}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data      # keeps the HTTPS certificates between restarts
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
